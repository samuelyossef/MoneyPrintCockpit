name: CI

on: [push, pull_request]

jobs:
  backend:
    name: Gateway tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements.txt -r gateway/requirements-dev.txt
      - name: Smoke-import the application
        run: python -c "from gateway import main; print(main.APP_VERSION)"
      - name: Run gateway tests
        run: python -m pytest gateway/tests -q --timeout=120

  version:
    name: Unified SemVer check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check VERSION / package.json / API consistency
        run: npm run version:check
