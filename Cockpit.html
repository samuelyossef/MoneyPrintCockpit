<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoneyPrinter — Cockpit</title>
  <link rel="icon" href="data:," />

  <!-- ========================================================
       Tipografia do Sistema (Google Fonts)
       - Inter: Fonte sem serifa primária para UI e leitura
       - JetBrains Mono: Fonte monoespaçada para métricas e logs
       - Instrument Serif: Fonte serifada para detalhes editoriais
       ======================================================== -->

  <!-- ========================================================
       Estilos CSS Compartilhados e Específicos
       - shell.css: Design system, reset, grid, sidebar e topbar
       - cockpit.css: Estilos dos cartões de vídeo, forms e pipeline
       ======================================================== -->
  <link rel="stylesheet" href="shared/shell.css" />
  <link rel="stylesheet" href="shared/cockpit.css" />
</head>
<body>
  <!-- ========================================================
       Estrutura Principal da Aplicação (Layout em Grid/Flex)
       ======================================================== -->
  <div class="app">
    <!-- Barra lateral de navegação (injetada dinamicamente via JS) -->
    <aside class="sidebar" id="sidebar-root"></aside>

    <!-- Área de conteúdo central -->
    <div class="main">
      <!-- Barra superior: status, alternância de tema, busca e perfil -->
      <div class="topbar" id="topbar-root"></div>

      <!-- Área de rolagem vertical com cabeçalho e corpo da view ativa -->
      <div class="view-body-scroll">
        <div class="view-hd-main" id="viewHead"></div>
        <div id="viewBody"></div>
      </div>
    </div>
  </div>

  <!-- Camadas de fundo para fechar menus em telas menores (Backdrops) -->
  <div class="sb-backdrop"></div>
  <div class="dr-backdrop"></div>

  <!-- Drawer Lateral: Painel deslizante para inspeção rápida de logs/detalhes -->
  <aside class="drawer" aria-label="Inspeção rápida">
    <div class="dr-hd" id="drHead"></div>
    <div class="dr-bd" id="drBody"></div>
    <div class="dr-ft" id="drFoot"></div>
  </aside>

  <div class="assistant-panel-backdrop" id="assistantPanelBackdrop" aria-hidden="true"></div>
  <aside class="assistant-panel" id="assistantPanel" aria-label="Chat do assistente" aria-hidden="true">
    <div class="assistant-panel-header">
      <div class="assistant-panel-heading"><span class="assistant-avatar">MP</span><div><strong>Assistente</strong><div class="assistant-panel-caption">Converse sobre o Growth OS e outras funções</div></div></div>
      <div style="display:flex;gap:5px"><button class="btn sm" id="assistantPanelExpand" type="button" aria-label="Expandir chat" title="Expandir chat">Expandir</button><button class="icon-btn" id="assistantPanelClose" type="button" aria-label="Fechar chat" title="Fechar chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    </div>
    <div class="assistant-panel-content" id="assistantPanelContent"></div>
  </aside>

  <!-- Contêiner flutuante para notificações Toast -->
  <div class="toast-wrap" id="toasts"></div>

  <!-- ========================================================
       Scripts da Aplicação (Ordem de Execução Sequencial)
       1. image-slot.js: Utilitário para slots e placeholders visuais
       2. cockpit-data.js: Mock de dados, canais, vídeos e métricas
       3. cockpit-views.js: Funções de renderização de cada tela
       4. cockpit-app.js: Roteamento, drawer, tema e inicialização
       ======================================================== -->
  <script src="shared/image-slot.js"></script>
  <script src="shared/cockpit-data.js"></script>
  <script src="shared/cockpit-views.js?v=20260922assistant-chat"></script>
  <script src="shared/moneyprinter-runtime.js?v=20260922assistant-chat"></script>
  <script src="shared/cockpit-flow.js?v=20260924simplify"></script>
  <script src="shared/cockpit-app.js?v=20260924simplify"></script>
</body>
</html>
